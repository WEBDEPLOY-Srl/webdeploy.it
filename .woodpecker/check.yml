# Verification for every push, on every branch. It needs no secrets, mounts no
# volumes and never touches the Docker socket, so it is safe to run for any
# commit. The image is built and pushed by `.build.yml`, which waits for this
# workflow and only runs for main.
#
# Pull requests are not run: the repository takes issues only, so the only
# trigger is `push`.
#
# Steps run one after another in a shared workspace. Every Node step uses the
# Playwright image, so dependencies are installed once, for the platform they
# run on (glibc), and the browsers match the installed @playwright/test. When
# @playwright/test changes, change the image tag and digest with it; the
# `playwright` step refuses to start on a mismatch.
#
# Images are pinned by digest so that a moved tag cannot change what is checked.
# The nginx image is the one the Dockerfile ships; keep the two in step.

when:
  - event: push

steps:
  - name: reuse
    image: fsfe/reuse:6.3.0@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6
    commands:
      # Before any install, so there is no node_modules for the licence scan to read.
      - reuse lint

  - name: nginx
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    commands:
      - cp nginx.conf /etc/nginx/conf.d/default.conf
      - nginx -t

  - name: install
    image: &node mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    commands:
      - cd src
      - npm ci

  - name: lint
    image: *node
    commands:
      - cd src
      - npm run lint

  - name: check
    image: *node
    commands:
      - cd src
      - npm run check

  - name: unit
    image: *node
    commands:
      - cd src
      - npm run test:unit

  - name: build
    image: *node
    commands:
      - cd src
      - npm run build

  - name: csp
    image: *node
    commands:
      - cd src
      # Fails if a built page has no Content-Security-Policy tag.
      - node scripts/nginx-csp.mjs build csp-pages.map

  - name: nginx-csp
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    commands:
      # The configuration as the image ships it: with the generated policy map.
      - mkdir -p /etc/nginx/csp
      - cp src/csp-pages.map /etc/nginx/csp/pages.map
      - cp nginx.conf /etc/nginx/conf.d/default.conf
      - nginx -t

  - name: audit
    image: *node
    commands:
      - cd src
      - npm audit --audit-level=high

  - name: playwright
    image: *node
    commands:
      - cd src
      - test "$(npx playwright --version)" = "Version 1.65.1"
      - npx playwright test
