# Every push is checked without credentials, host mounts or a Docker socket.
# The main-only image workflow depends on this check.
when:
  - event: push

steps:
  - name: reuse
    image: fsfe/reuse:6.3.0@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6
    commands:
      - reuse lint

  - name: build
    image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    commands:
      - cd src
      - node --test --test-isolation=none test/*.test.mjs
      - node build.mjs

  - name: nginx-site
    image: &nginx nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    detach: true
    commands:
      - cp nginx.conf /etc/nginx/conf.d/default.conf
      - cp -R src/build/. /usr/share/nginx/html/
      - nginx -t
      - |
        set -eu
        state="src/.build-generations/ci-nginx-$${CI_PIPELINE_NUMBER}"
        mkdir -p "$$state"
        rm -f "$$state/stop" "$$state/stopped"
        (
          until test -f "$$state/stop"; do sleep 1; done
          nginx -s quit
        ) &
        nginx -g 'daemon off;'
        test -f "$$state/stop"
        touch "$$state/stopped"

  - name: install
    image: &browser mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    commands:
      - cd src
      - npm ci --include=dev

  - name: audit
    image: *browser
    commands:
      - cd src
      - npm ls --all
      - npm audit --audit-level=high

  - name: syntax
    image: *browser
    commands:
      - cd src
      - npm run lint

  - name: typecheck
    image: *browser
    commands:
      - cd src
      - npm run typecheck

  - name: playwright
    image: *browser
    commands:
      - cd src
      - test "$(npx --no-install playwright --version)" = "Version 1.65.1"
      - |
        NGINX_UPSTREAM=http://nginx-site PORT=4173 node build-tools/serve.mjs > /tmp/site-relay.log 2>&1 &
        node --input-type=module -e '
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch("http://127.0.0.1:4173/_app/version.json", {signal: AbortSignal.timeout(1500)});
              if (response.ok && (await response.json()).version.startsWith("2-")) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          throw new Error("The production nginx service did not become ready");
        '
        E2E_BASE_URL=http://127.0.0.1:4173 npm run test:e2e

  # Finish the service explicitly so the runner records nginx's real exit code.
  - name: stop-nginx
    image: *nginx
    when:
      status: [success, failure]
    commands:
      - |
        set -eu
        state="src/.build-generations/ci-nginx-$${CI_PIPELINE_NUMBER}"
        if ! test -d "$$state"; then exit 0; fi
        touch "$$state/stop"
        for attempt in $(seq 1 30); do
          if test -f "$$state/stopped"; then exit 0; fi
          sleep 1
        done
        echo 'nginx did not confirm a clean shutdown' >&2
        exit 1
