# Cache-Control for every response, chosen by the URI nginx finally serves.
#  - Hashed build output never changes under the same name.
#  - Pages are revalidated on every visit (the ETag makes that cheap), so a
#    release shows up at once.
#  - The temporary early-access redirect is `no-store`; permanent redirects use the default one-hour cache.
#  - Everything else (fonts, images, favicon, robots.txt) has no hashed name,
#    so it only gets a short cache.
map $uri $cache_control {
    default                           "public, max-age=3600";
    "~^/assets/build/[0-9a-f]{16}/"   "public, max-age=31536000, immutable";
    "~^/assets/media/.+\.[0-9a-f]{16}\.[^/]+$" "public, max-age=31536000, immutable";
    /_app/version.json                "no-cache";
    ~\.html$                          "no-cache";
    ~^/early-access                   "no-store";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Do not advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Compression: use the .gz files the build writes next to each asset, and
    # compress on the fly only what has none.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Response headers. They are set here and nowhere else: nginx drops every
    # inherited add_header in a location that sets one of its own, which once
    # left scripts and images without any. Locations below must not add headers.
    # `always` keeps them on redirects and error responses too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.inwd.org https://connect.facebook.net; connect-src 'self' https://analytics.inwd.org https://newsletter.webdeploy.it https://www.facebook.com https://connect.facebook.net; img-src 'self' data: https://tile.openstreetmap.org https://analytics.inwd.org https://www.facebook.com; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://newsletter.webdeploy.it; frame-ancestors 'self'" always;
    add_header Cache-Control $cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Retired early-access funnel. Temporary (302) until this redirect is no longer needed.
    # Keep the redirect relative: the TLS proxy terminates HTTPS upstream.
    location ~ ^/early-access(/confermato)?/?$ {
        return 302 /newsletter$is_args$args;
    }

    # Retired services overview: each service has its own page; the homepage
    # services section is the closest replacement. Permanent (301).
    location ~ ^/services/?$ {
        return 301 /#services;
    }

    # Retired gap-analysis PDF: gone for good.
    location = /uploads/nis2-cra-gap-analysis.pdf {
        return 410;
    }

    # Canonicalize real page URLs, while leaving unknown paths as 404s.
    location ~ ^(.+)/$ {
        if (-f $document_root$1.html) {
            return 301 $1$is_args$args;
        }
        return 404;
    }

    # Native modules require a JavaScript MIME type under nosniff.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Map clean page URLs to their generated HTML files.
    location / {
        try_files $uri $uri.html =404;
    }

    # Unknown paths get the site's own page (the build's 404 fallback), still with status 404.
    error_page 404 /404.html;
}
