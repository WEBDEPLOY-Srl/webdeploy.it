# Per-page Content-Security-Policy. SvelteKit hashes the inline script of each
# page, so the policy differs from page to page; `scripts/nginx-csp.mjs` turns the
# policy in every built page into /etc/nginx/csp/pages.map (see the Dockerfile).
# The default covers everything that is not a page (scripts, styles, images) and
# any build made without the generated file.
map $uri $csp {
    default "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
    include /etc/nginx/csp/*.map;
}

# Cache-Control for every response, chosen by the URI nginx finally serves.
#  - Hashed build output never changes under the same name.
#  - Pages are revalidated on every visit (the ETag makes that cheap), so a
#    release shows up at once.
#  - Redirects are not cached: the early-access one is temporary by design.
#  - Everything else (fonts, images, favicon, robots.txt) has no hashed name,
#    so it only gets a short cache.
map $uri $cache_control {
    default                           "public, max-age=3600";
    ~^/_app/immutable/                "public, max-age=31536000, immutable";
    ~\.html$                          "no-cache";
    ~^/early-access                   "no-store";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Compression: use the .gz files the build writes next to each asset, and
    # compress on the fly only what has none.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Response headers. They are set here and nowhere else: nginx drops every
    # inherited add_header in a location that sets one of its own, which once
    # left scripts and images without any. Locations below must not add headers.
    # `always` keeps them on redirects and error responses too.
    add_header Content-Security-Policy "$csp; frame-ancestors 'self'" always;
    add_header Cache-Control $cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Retired early-access funnel. Temporary (302) so it can later point to /newsletter.
    # absolute_redirect off keeps Location relative: behind the TLS proxy nginx would
    # otherwise build an http:// URL from the internal scheme.
    location ~ ^/early-access(/confermato)?/?$ {
        absolute_redirect off;
        return 302 /contacts;
    }

    # Retired services overview: each service has its own page; the homepage
    # services section is the closest replacement. Permanent (301).
    location ~ ^/services/?$ {
        absolute_redirect off;
        return 301 /#services;
    }

    # Retired gap-analysis PDF: gone for good.
    location = /uploads/nis2-cra-gap-analysis.pdf {
        return 410;
    }

    # Handle SvelteKit static adapter output
    # Maps clean URLs to .html files
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Unknown paths get the site's own page (the build's 404 fallback), still with status 404.
    error_page 404 /404.html;
}
