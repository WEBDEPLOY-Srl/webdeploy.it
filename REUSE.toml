version = 1
SPDX-PackageName = "webdeploy.it"
SPDX-PackageSupplier = "WEBDEPLOY S.R.L. <info@webdeploy.it>"
SPDX-PackageDownloadLocation = "https://github.com/WEBDEPLOY-Srl/webdeploy.it"

# Default: the source code.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 WEBDEPLOY S.R.L."
SPDX-License-Identifier = "AGPL-3.0-only"

# Names, logos, photographs, customer imagery, illustrations and marketing copy.
[[annotations]]
path = [
  "src/static/**/*.png",
  "src/static/**/*.jpg",
  "src/static/**/*.jpeg",
  "src/static/**/*.webp",
  "docs/*.webp",
  "src/static/*.svg",
  "src/static/images/*.svg",
  "src/src/lib/assets/favicon.svg",
  "src/src/lib/i18n/en.ts",
  "src/src/lib/i18n/it.ts",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 WEBDEPLOY S.R.L."
SPDX-License-Identifier = "LicenseRef-WEBDEPLOY-Reserved"

# Third-party names and logos traced into the source or shipped as images.
[[annotations]]
path = [
  "src/src/lib/assets/borgwarehouseLogo.ts",
  "src/src/lib/assets/furilabsLogo.ts",
  "src/src/lib/assets/linkdingLogo.ts",
]
precedence = "override"
SPDX-FileCopyrightText = "The respective owners of the depicted marks"
SPDX-License-Identifier = "LicenseRef-Third-Party-Marks"

# Fonts and icon font.
[[annotations]]
path = ["src/static/fonts/space-mono-*"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Space Mono Project Authors (https://github.com/googlefonts/spacemono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/static/fonts/vt323-*"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The VT323 Project Authors (peter.hull@oikoi.com)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/static/fonts/pixelarticons*"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Gerrit Halfmann"
SPDX-License-Identifier = "MIT"

# BorgBackup logo, recoloured.
[[annotations]]
path = ["src/static/images/borgbackup-logo.svg", "src/static/images/borgbackup-logo-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2015-2026 The Borg Collective",
  "2010-2014 Jonas Borgström",
  "2026 WEBDEPLOY S.R.L. (recolouring)",
]
SPDX-License-Identifier = "BSD-3-Clause"

# Contributor Covenant.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant (https://www.contributor-covenant.org)"
SPDX-License-Identifier = "CC-BY-4.0"
