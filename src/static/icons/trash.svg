<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>

  <!-- Trash lid -->
  <rect x="12" y="14" width="40" height="6" rx="2" fill="#15202e" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>

  <!-- Lid handle -->
  <rect x="26" y="8" width="12" height="6" rx="2" fill="#15202e" stroke="#ff00ff" stroke-width="2"/>

  <!-- Trash body -->
  <path d="M16,22 L18,54 L46,54 L48,22 Z" fill="#15202e" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>

  <!-- Trash lines -->
  <line x1="24" y1="28" x2="24" y2="48" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="32" y1="28" x2="32" y2="48" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="40" y1="28" x2="40" y2="48" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#cyanGlow)"/>
</svg>
