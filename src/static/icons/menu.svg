<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Hamburger lines -->
  <line x1="14" y1="20" x2="50" y2="20" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#ff00ff" stroke-width="4" stroke-linecap="round" filter="url(#magentaGlow)"/>
  <line x1="14" y1="44" x2="50" y2="44" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)"/>
</svg>
