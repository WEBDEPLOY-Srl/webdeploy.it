<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Magnifying glass circle -->
  <circle cx="28" cy="28" r="14" fill="#15202e" stroke="#00f0ff" stroke-width="3" filter="url(#cyanGlow)"/>

  <!-- Inner glow -->
  <circle cx="28" cy="28" r="8" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>

  <!-- Handle -->
  <line x1="38" y1="38" x2="52" y2="52" stroke="#ff00ff" stroke-width="5" stroke-linecap="round" filter="url(#magentaGlow)"/>
</svg>
