<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Pencil body -->
  <rect x="34" y="8" width="10" height="36" rx="2" fill="#15202e" stroke="#00f0ff" stroke-width="2"
        transform="rotate(45 32 32)" filter="url(#cyanGlow)"/>

  <!-- Pencil tip -->
  <polygon points="12,52 18,40 24,46" fill="#ff00ff" filter="url(#magentaGlow)"/>

  <!-- Pencil eraser -->
  <rect x="34" y="4" width="10" height="8" rx="2" fill="#ff00ff"
        transform="rotate(45 32 32)" filter="url(#magentaGlow)"/>

  <!-- Edit line indicator -->
  <line x1="10" y1="56" x2="30" y2="56" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
