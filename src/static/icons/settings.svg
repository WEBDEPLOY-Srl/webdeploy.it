<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Gear teeth -->
  <path d="M32,8 L36,14 L44,14 L46,20 L52,24 L50,32 L52,40 L46,44 L44,50 L36,50 L32,56 L28,50 L20,50 L18,44 L12,40 L14,32 L12,24 L18,20 L20,14 L28,14 Z"
        fill="#15202e" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>

  <!-- Inner circle -->
  <circle cx="32" cy="32" r="10" fill="#0e1621" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#00f0ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
