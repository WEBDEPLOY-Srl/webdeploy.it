<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>

  <!-- Circle frame -->
  <circle cx="32" cy="32" r="22" fill="#15202e" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>

  <!-- X mark -->
  <line x1="22" y1="22" x2="42" y2="42" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <line x1="42" y1="22" x2="22" y2="42" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)"/>
</svg>
