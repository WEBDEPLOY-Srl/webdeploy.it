<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0e1621"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Arrow body -->
  <line x1="12" y1="32" x2="48" y2="32" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Arrow head -->
  <polyline points="36,18 50,32 36,46" fill="none" stroke="#ff00ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#magentaGlow)"/>
</svg>
