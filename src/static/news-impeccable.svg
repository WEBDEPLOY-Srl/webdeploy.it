<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="imp-title imp-desc">
  <title id="imp-title">Impeccable Style — design transformation</title>
  <desc id="imp-desc">A glitchy, misaligned website panel transforms into a clean, polished one, with a neon arrow, sparkles and an IMPECCABLE badge, in cyan and magenta on a dark grid.</desc>
  <defs>
    <!-- Grid pattern -->
    <pattern id="imp-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    </pattern>
    <!-- Dual-layer glows -->
    <filter id="imp-cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="imp-magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff00ff" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="imp-panelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15202e"/>
      <stop offset="100%" stop-color="#0a0f15"/>
    </linearGradient>
    <linearGradient id="imp-sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="imp-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="imp-clip">
      <rect x="0" y="0" width="200" height="250"/>
    </clipPath>
    <style>
      .imp-march { animation: imp-march 1s linear infinite; }
      .imp-glitch { animation: imp-glitch 4.5s steps(1) infinite; }
      .imp-twinkle { animation: imp-twinkle 1.8s ease-in-out infinite; }
      .imp-t2 { animation-delay: 0.6s; }
      .imp-t3 { animation-delay: 1.2s; }
      .imp-sheen { animation: imp-sheen 6s ease-in-out infinite; }
      .imp-draw { stroke-dasharray: 18; animation: imp-draw 0.5s ease-out 1.4s backwards; }
      .imp-star { transform-box: fill-box; transform-origin: center; animation: imp-rot 14s linear infinite, imp-op 2s ease-in-out infinite; }
      .imp-spin { transform-box: fill-box; transform-origin: center; animation: imp-rot 8s linear infinite; }
      .imp-spin-rev { transform-box: fill-box; transform-origin: center; animation: imp-rot-rev 12s linear infinite; }
      @keyframes imp-march { to { stroke-dashoffset: -24; } }
      @keyframes imp-glitch {
        0%, 90%, 100% { transform: translate(0, 0); }
        92% { transform: translate(-2.5px, 1px); }
        94% { transform: translate(2px, -1.5px); }
        96% { transform: translate(-1px, 0.5px); }
        98% { transform: translate(1.5px, 1px); }
      }
      @keyframes imp-twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
      @keyframes imp-sheen { 0% { transform: translateX(0); } 35%, 100% { transform: translateX(310px); } }
      @keyframes imp-draw { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
      @keyframes imp-rot { to { transform: rotate(360deg); } }
      @keyframes imp-rot-rev { to { transform: rotate(-360deg); } }
      @keyframes imp-op { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .imp-sat { display: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#050a10"/>
  <rect width="600" height="400" fill="url(#imp-grid)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="380" x2="600" y2="380" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="20" x2="600" y2="20" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>

  <!-- Before Panel: glitchy, misaligned -->
  <g transform="translate(40, 60)">
    <g class="imp-glitch">
      <rect x="0" y="0" width="200" height="250" fill="url(#imp-panelGradient)" stroke="#ff00ff" stroke-width="2" opacity="0.65"/>
      <rect x="0" y="0" width="200" height="24" fill="#15202e"/>
      <circle cx="14" cy="12" r="5" fill="#ff00ff" opacity="0.5"/>
      <circle cx="32" cy="12" r="5" fill="#0e1621"/>
      <circle cx="50" cy="12" r="5" fill="#0e1621"/>

      <!-- Messy, overflowing content -->
      <g transform="translate(10, 35)" opacity="0.6">
        <rect x="5" y="0" width="80" height="15" fill="#ff00ff" opacity="0.3"/>
        <rect x="15" y="25" width="120" height="10" fill="#ff00ff" opacity="0.2"/>
        <rect x="-10" y="45" width="90" height="10" fill="#ff00ff" opacity="0.25"/>
        <rect x="30" y="65" width="140" height="8" fill="#ff00ff" opacity="0.2"/>
        <rect x="110" y="60" width="75" height="30" fill="#ff00ff" opacity="0.2"/>
        <rect x="5" y="135" width="170" height="8" fill="#ff00ff" opacity="0.2"/>
        <rect x="20" y="155" width="130" height="8" fill="#ff00ff" opacity="0.15"/>
        <rect x="0" y="175" width="100" height="8" fill="#ff00ff" opacity="0.2"/>
      </g>

      <!-- Broken image -->
      <g transform="translate(10, 35)">
        <rect x="5" y="85" width="55" height="42" fill="rgba(255,0,255,0.08)" stroke="#ff00ff" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.7"/>
        <circle cx="16" cy="95" r="3" fill="none" stroke="#ff00ff" stroke-width="1.2" opacity="0.7"/>
        <path d="M 10 122 L 24 103 L 34 114 L 41 107 L 55 122" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.7"/>
        <path d="M 5 85 L 60 127" stroke="#ff00ff" stroke-width="1" opacity="0.8"/>
      </g>

      <!-- Chromatic tears -->
      <rect x="10" y="118" width="180" height="5" fill="#00f0ff" opacity="0.18" transform="translate(-4,0)"/>
      <rect x="12" y="76" width="176" height="4" fill="#ff00ff" opacity="0.22" transform="translate(5,0)"/>

      <!-- Error badge -->
      <g transform="translate(28, 228)">
        <circle r="10" fill="#0e1621" stroke="#ff00ff" stroke-width="1.5"/>
        <path d="M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#ff00ff" stroke-width="2"/>
      </g>
      <text x="100" y="235" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="12" opacity="0.8">BEFORE</text>
    </g>
  </g>

  <!-- Transformation arrow -->
  <g transform="translate(260, 160)">
    <path class="imp-march" d="M 0 25 L 58 25" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 4" fill="none"/>
    <polygon points="58,13 82,25 58,37" fill="#00f0ff" filter="url(#imp-cyanGlow)"/>
    <path class="imp-twinkle" transform="translate(18, 6)" d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#ff00ff"/>
    <path class="imp-twinkle imp-t2" transform="translate(50, 42)" d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#00f0ff"/>
    <path class="imp-twinkle imp-t3" transform="translate(38, -2) scale(0.7)" d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#ff00ff"/>
  </g>

  <!-- After Panel: polished -->
  <g transform="translate(360, 60)">
    <rect x="5" y="5" width="200" height="250" fill="rgba(0,240,255,0.25)"/>
    <rect x="0" y="0" width="200" height="250" fill="url(#imp-panelGradient)" stroke="#00f0ff" stroke-width="2" filter="url(#imp-cyanGlow)"/>
    <rect x="0" y="0" width="200" height="24" fill="#00f0ff"/>
    <circle cx="14" cy="12" r="5" fill="#ff00ff"/>
    <circle cx="32" cy="12" r="5" fill="#0e1621"/>
    <circle cx="50" cy="12" r="5" fill="#0e1621"/>
    <rect x="62" y="7" width="126" height="10" fill="#0e1621" opacity="0.55"/>

    <!-- Clean, aligned content -->
    <g transform="translate(10, 35)">
      <rect x="0" y="0" width="100" height="15" fill="#00f0ff" opacity="0.4"/>
      <rect x="0" y="25" width="180" height="10" fill="#00f0ff" opacity="0.3"/>
      <rect x="0" y="45" width="180" height="10" fill="#00f0ff" opacity="0.3"/>
      <rect x="0" y="65" width="140" height="8" fill="#00f0ff" opacity="0.25"/>
      <rect x="0" y="85" width="85" height="60" fill="#00f0ff" opacity="0.2" stroke="#00f0ff" stroke-width="1"/>
      <rect x="95" y="85" width="85" height="60" fill="#ff00ff" opacity="0.2" stroke="#ff00ff" stroke-width="1"/>
      <rect x="0" y="155" width="180" height="8" fill="#00f0ff" opacity="0.3"/>
      <rect x="0" y="170" width="150" height="8" fill="#00f0ff" opacity="0.25"/>
      <rect x="0" y="185" width="120" height="8" fill="#00f0ff" opacity="0.2"/>
    </g>

    <!-- Sheen sweep -->
    <g clip-path="url(#imp-clip)">
      <g class="imp-sheen">
        <rect x="-50" y="-30" width="36" height="310" fill="url(#imp-sheenGrad)" transform="rotate(16)"/>
      </g>
    </g>

    <text x="100" y="235" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">AFTER</text>
    <g transform="translate(160, 215)">
      <circle r="12" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
      <path class="imp-draw" d="M -5 0 L -2 4 L 6 -4" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- AI spark emblem -->
  <g transform="translate(300, 100)">
    <polygon class="imp-star" points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ff00ff" filter="url(#imp-magentaGlow)"/>
    <circle class="imp-spin" r="20" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.35" stroke-dasharray="2 4"/>
    <circle class="imp-spin-rev" r="28" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.15" stroke-dasharray="3 6"/>
    <g transform="translate(20, 0)">
      <circle class="imp-sat" r="2" fill="#00f0ff">
        <animateMotion path="M 0 0 A 20 20 0 1 1 -40 0 A 20 20 0 1 1 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- IMPECCABLE badge -->
  <g transform="translate(300, 340)">
    <rect x="-76" y="-16" width="160" height="35" fill="rgba(0,240,255,0.3)"/>
    <rect x="-80" y="-20" width="160" height="35" fill="#0e1621" stroke="#ff00ff" stroke-width="2" filter="url(#imp-magentaGlow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">IMPECCABLE</text>
  </g>

  <!-- Labels -->
  <text x="300" y="40" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.7">DESIGN TRANSFORMATION</text>
  <text x="140" y="330" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="9" opacity="0.8">UNPOLISHED</text>
  <text x="460" y="330" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" opacity="0.8">REFINED</text>

  <!-- Corner accents -->
  <path d="M 10 10 L 10 40 M 10 10 L 40 10" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 590 10 L 590 40 M 590 10 L 560 10" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 10 390 L 10 360 M 10 390 L 40 390" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 590 390 L 590 360 M 590 390 L 560 390" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- CRT vignette -->
  <rect width="600" height="400" fill="url(#imp-vignette)" pointer-events="none"/>
</svg>
