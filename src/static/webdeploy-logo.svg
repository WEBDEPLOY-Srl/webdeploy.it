<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,240,255,0.1)" stroke-width="1"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.9"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff00ff" flood-opacity="0.9"/>
    </filter>
    <filter id="strongGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.6"/>
    </filter>
    <!-- Gradient for terminal -->
    <linearGradient id="termGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#15202e"/>
      <stop offset="100%" style="stop-color:#0a0f15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#050a10"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Outer hexagon frame -->
  <polygon
    points="200,30 350,100 350,300 200,370 50,300 50,100"
    fill="none"
    stroke="#00f0ff"
    stroke-width="3"
    filter="url(#cyanGlow)"
  />

  <!-- Inner hexagon -->
  <polygon
    points="200,50 330,110 330,290 200,350 70,290 70,110"
    fill="#0e1621"
    stroke="#ff00ff"
    stroke-width="1"
    opacity="0.8"
  />

  <!-- Terminal window -->
  <g transform="translate(90, 90)">
    <!-- Terminal frame -->
    <rect x="0" y="0" width="220" height="180" fill="url(#termGradient)" stroke="#00f0ff" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="220" height="24" fill="#00f0ff"/>
    <circle cx="14" cy="12" r="5" fill="#ff00ff"/>
    <circle cx="32" cy="12" r="5" fill="#0e1621"/>
    <circle cx="50" cy="12" r="5" fill="#0e1621"/>
    <text x="110" y="17" text-anchor="middle" fill="#0e1621" font-family="monospace" font-size="11" font-weight="bold">inwd.sh</text>

    <!-- Terminal content -->
    <g transform="translate(12, 36)">
      <text fill="#00f0ff" font-family="monospace" font-size="12">
        <tspan x="0" dy="0" fill="#ff00ff">$</tspan>
        <tspan> inwd init</tspan>
      </text>
      <text y="20" fill="#00f0ff" font-family="monospace" font-size="11" opacity="0.8">
        <tspan x="0">Initializing...</tspan>
      </text>
      <text y="40" fill="#ff00ff" font-family="monospace" font-size="11">
        <tspan x="0">✓ Infrastructure ready</tspan>
      </text>
      <text y="60" fill="#ff00ff" font-family="monospace" font-size="11">
        <tspan x="0">✓ Containers deployed</tspan>
      </text>
      <text y="80" fill="#ff00ff" font-family="monospace" font-size="11">
        <tspan x="0">✓ GitOps enabled</tspan>
      </text>
      <text y="105" fill="#00f0ff" font-family="monospace" font-size="12">
        <tspan x="0" fill="#ff00ff">$</tspan>
        <tspan> _</tspan>
      </text>
      <!-- Blinking cursor -->
      <rect x="20" y="95" width="10" height="14" fill="#00f0ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Deployment arrows -->
  <g stroke-width="2" fill="none">
    <!-- Arrow from left -->
    <path d="M 60 200 L 85 200" stroke="#ff00ff" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="85,195 95,200 85,205" fill="#ff00ff"/>

    <!-- Arrow to right -->
    <path d="M 305 200 L 330 200" stroke="#00f0ff" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="330,195 340,200 330,205" fill="#00f0ff"/>
  </g>

  <!-- WD Badge -->
  <g transform="translate(200, 320)">
    <rect x="-50" y="-20" width="100" height="35" fill="#0e1621" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="4">WD</text>
  </g>

  <!-- Connection nodes -->
  <circle cx="60" cy="200" r="8" fill="#0e1621" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>
  <circle cx="340" cy="200" r="8" fill="#0e1621" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Top decoration -->
  <g transform="translate(200, 55)">
    <circle cx="0" cy="0" r="12" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner accents -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 380 20 L 380 50 M 380 20 L 350 20" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 20 380 L 20 350 M 20 380 L 50 380" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 380 380 L 380 350 M 380 380 L 350 380" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- Status indicator -->
  <g transform="translate(200, 385)">
    <circle cx="-48" cy="0" r="4" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9" opacity="0.8">SYSTEM ONLINE</text>
    <circle cx="48" cy="0" r="4" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
