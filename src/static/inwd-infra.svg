<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="inf-title inf-desc">
  <title id="inf-title">inWD infrastructure</title>
  <desc id="inf-desc">Two neon server racks linked to a hexagonal inWD orchestration hub, which connects to Git and CLI endpoints, with data packets flowing between them on a dark grid.</desc>
  <defs>
    <!-- Grid pattern -->
    <pattern id="inf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,240,255,0.1)" stroke-width="1"/>
    </pattern>
    <!-- CRT scanlines -->
    <pattern id="inf-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.18)"/>
    </pattern>
    <!-- Dual-layer glows -->
    <filter id="inf-cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="inf-magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff00ff" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="inf-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <style>
      .inf-march { animation: inf-march 1s linear infinite; }
      .inf-blink { animation: inf-blink 1s steps(1) infinite; }
      .inf-pulse { animation: inf-pulse 2s ease-in-out infinite; }
      .inf-bar { transform-box: fill-box; transform-origin: left center; animation: inf-bar 2.8s ease-in-out infinite; }
      .inf-rot { transform-box: fill-box; transform-origin: center; animation: inf-rot 12s linear infinite; }
      .inf-rot-rev { transform-box: fill-box; transform-origin: center; animation: inf-rot-rev 9s linear infinite; }
      .inf-d2 { animation-delay: 0.7s; }
      .inf-d3 { animation-delay: 1.3s; }
      .inf-d4 { animation-delay: 1.8s; }
      @keyframes inf-march { to { stroke-dashoffset: -20; } }
      @keyframes inf-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes inf-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes inf-bar { 0%, 100% { transform: scaleX(0.35); } 40% { transform: scaleX(1); } 70% { transform: scaleX(0.55); } }
      @keyframes inf-rot { to { transform: rotate(360deg); } }
      @keyframes inf-rot-rev { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .inf-pkt, .inf-sat { display: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#050a10"/>
  <rect width="800" height="400" fill="url(#inf-grid)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="20" x2="800" y2="20" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>

  <!-- Server Rack 1 -->
  <g transform="translate(80, 80)">
    <rect x="5" y="5" width="120" height="240" fill="rgba(0,240,255,0.15)"/>
    <rect x="0" y="0" width="120" height="240" fill="#0e1621" stroke="#00f0ff" stroke-width="2" filter="url(#inf-cyanGlow)"/>
    <rect x="10" y="15" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse" cx="95" cy="27" r="4" fill="#00f0ff"/>
    <rect class="inf-bar" x="20" y="24" width="40" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="50" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d3" cx="95" cy="62" r="4" fill="#00f0ff"/>
    <rect class="inf-bar inf-d2" x="20" y="59" width="30" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="85" width="100" height="25" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d2" cx="95" cy="97" r="4" fill="#ff00ff"/>
    <rect class="inf-bar inf-d3" x="20" y="94" width="50" height="3" fill="#ff00ff" opacity="0.5"/>
    <rect x="10" y="120" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d4" cx="95" cy="132" r="4" fill="#00f0ff"/>
    <rect class="inf-bar" x="20" y="129" width="35" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="155" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse" cx="95" cy="167" r="4" fill="#00f0ff"/>
    <rect class="inf-bar inf-d4" x="20" y="164" width="45" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="190" width="100" height="25" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d3" cx="95" cy="202" r="4" fill="#ff00ff"/>
    <rect class="inf-bar inf-d2" x="20" y="199" width="25" height="3" fill="#ff00ff" opacity="0.5"/>
    <text x="60" y="230" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="8" opacity="0.6">NODE-01</text>
  </g>

  <!-- Server Rack 2 -->
  <g transform="translate(240, 80)">
    <rect x="5" y="5" width="120" height="240" fill="rgba(255,0,255,0.15)"/>
    <rect x="0" y="0" width="120" height="240" fill="#0e1621" stroke="#ff00ff" stroke-width="2" filter="url(#inf-magentaGlow)"/>
    <rect x="10" y="15" width="100" height="25" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d2" cx="95" cy="27" r="4" fill="#ff00ff"/>
    <rect class="inf-bar inf-d3" x="20" y="24" width="35" height="3" fill="#ff00ff" opacity="0.5"/>
    <rect x="10" y="50" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse" cx="95" cy="62" r="4" fill="#00f0ff"/>
    <rect class="inf-bar" x="20" y="59" width="50" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="85" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d4" cx="95" cy="97" r="4" fill="#00f0ff"/>
    <rect class="inf-bar inf-d2" x="20" y="94" width="40" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="120" width="100" height="25" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d3" cx="95" cy="132" r="4" fill="#ff00ff"/>
    <rect class="inf-bar inf-d4" x="20" y="129" width="55" height="3" fill="#ff00ff" opacity="0.5"/>
    <rect x="10" y="155" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse inf-d2" cx="95" cy="167" r="4" fill="#00f0ff"/>
    <rect class="inf-bar inf-d3" x="20" y="164" width="30" height="3" fill="#00f0ff" opacity="0.5"/>
    <rect x="10" y="190" width="100" height="25" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="inf-pulse" cx="95" cy="202" r="4" fill="#00f0ff"/>
    <rect class="inf-bar" x="20" y="199" width="45" height="3" fill="#00f0ff" opacity="0.5"/>
    <text x="60" y="230" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="8" opacity="0.6">NODE-02</text>
  </g>

  <!-- Central Hub -->
  <g transform="translate(460, 120)">
    <polygon points="100,0 180,50 180,130 100,180 20,130 20,50" fill="rgba(255,0,255,0.18)" transform="translate(5,5)"/>
    <polygon points="100,0 180,50 180,130 100,180 20,130 20,50" fill="#0e1621" stroke="#00f0ff" stroke-width="3" filter="url(#inf-cyanGlow)"/>
    <polygon points="100,20 160,60 160,120 100,160 40,120 40,60" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5"/>
    <!-- Rotating orchestration rings -->
    <circle class="inf-rot" cx="100" cy="90" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
    <circle class="inf-rot-rev" cx="100" cy="90" r="28" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
    <!-- Orbiting satellite -->
    <g transform="translate(138, 90)">
      <circle class="inf-sat" r="3.5" fill="#ff00ff">
        <animateMotion path="M 0 0 A 38 38 0 1 1 -76 0 A 38 38 0 1 1 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="100" cy="90" r="16" fill="#00f0ff" opacity="0.2"/>
    <circle class="inf-pulse" cx="100" cy="90" r="9" fill="#00f0ff"/>
    <text x="100" y="148" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">INWD</text>
  </g>

  <!-- Connection lines: rack 1 → rack 2 → hub → endpoints -->
  <g stroke-width="2" fill="none">
    <path class="inf-march" d="M 200 200 L 240 200" stroke="#00f0ff" stroke-dasharray="5 5"/>
    <path class="inf-march" d="M 360 200 C 410 200 440 208 480 210" stroke="#ff00ff" stroke-dasharray="5 5"/>
    <path class="inf-march" d="M 642 196 C 680 180 700 150 724 121" stroke="#00f0ff" stroke-dasharray="5 5"/>
    <path class="inf-march" d="M 642 224 C 676 238 690 230 708 226" stroke="#ff00ff" stroke-dasharray="5 5"/>
  </g>
  <!-- Data packets -->
  <g transform="translate(200, 200)">
    <circle class="inf-pkt" r="3" fill="#00f0ff">
      <animateMotion path="M 0 0 L 40 0" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(360, 200)">
    <circle class="inf-pkt" r="3" fill="#ff00ff">
      <animateMotion path="M 0 0 C 50 0 80 8 120 10" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(642, 196)">
    <circle class="inf-pkt" r="3" fill="#00f0ff">
      <animateMotion path="M 0 0 C 38 -16 58 -46 82 -75" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(642, 224)">
    <circle class="inf-pkt" r="3" fill="#ff00ff">
      <animateMotion path="M 0 0 C 34 14 48 6 66 2" dur="2s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Git endpoint -->
  <g transform="translate(700, 100)">
    <circle class="inf-pulse" cx="30" cy="16" r="7" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
    <circle class="inf-pulse inf-d2" cx="30" cy="56" r="7" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
    <line x1="30" y1="23" x2="30" y2="49" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="52" cy="36" r="6" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <path d="M 36 20 Q 52 22 52 30" stroke="#ff00ff" stroke-width="2" fill="none"/>
    <path d="M 52 42 Q 52 50 36 52" stroke="#ff00ff" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
    <text x="30" y="84" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="10">GIT</text>
  </g>

  <!-- CLI endpoint -->
  <g transform="translate(700, 200)">
    <rect x="10" y="10" width="46" height="32" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <text x="16" y="31" fill="#ff00ff" font-family="monospace" font-size="13">&gt;</text>
    <rect class="inf-blink" x="28" y="21" width="7" height="11" fill="#ff00ff"/>
    <text x="33" y="62" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="10">CLI</text>
  </g>

  <!-- Bottom labels -->
  <g font-family="monospace" font-size="11" opacity="0.8">
    <text x="140" y="350" text-anchor="middle" fill="#00f0ff">SERVERS</text>
    <text x="300" y="350" text-anchor="middle" fill="#ff00ff">CONTAINERS</text>
    <text x="560" y="350" text-anchor="middle" fill="#00f0ff">ORCHESTRATION</text>
    <text x="730" y="350" text-anchor="middle" fill="#ff00ff">GITOPS</text>
  </g>

  <!-- Corner accents -->
  <path d="M 10 10 L 10 40 M 10 10 L 40 10" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 790 10 L 790 40 M 790 10 L 760 10" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 10 390 L 10 360 M 10 390 L 40 390" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 790 390 L 790 360 M 790 390 L 760 390" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- Scanlines + vignette -->
  <rect width="800" height="400" fill="url(#inf-scan)" opacity="0.25" pointer-events="none"/>
  <rect width="800" height="400" fill="url(#inf-vignette)" pointer-events="none"/>
</svg>
