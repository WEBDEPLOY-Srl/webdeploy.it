<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(0,240,255,0.06)" stroke-width="1"/>
    </pattern>
    <!-- Floor grid -->
    <pattern id="floorGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>
    </pattern>
    <!-- Glow filters -->
    <filter id="cyanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
    <filter id="magentaGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff00ff" flood-opacity="0.8"/>
    </filter>
    <filter id="screenGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>
    <!-- Bottle gradient -->
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a"/>
      <stop offset="100%" style="stop-color:#0a0f15"/>
    </linearGradient>
    <!-- Bar gradient -->
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#15202e"/>
      <stop offset="100%" style="stop-color:#0e1621"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#050a10"/>
  <rect width="1000" height="500" fill="url(#grid)"/>

  <!-- Floor -->
  <rect x="0" y="350" width="1000" height="150" fill="#080d14"/>
  <rect x="0" y="350" width="1000" height="150" fill="url(#floorGrid)"/>

  <!-- Back wall accent lines -->
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="350" x2="1000" y2="350" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>

  <!-- ===== LEFT SIDE: COMPUTER DESKS ===== -->

  <!-- Desk 1 -->
  <g transform="translate(50, 180)">
    <!-- Desk surface -->
    <rect x="0" y="120" width="200" height="15" fill="#15202e" stroke="#00f0ff" stroke-width="2"/>
    <!-- Desk legs -->
    <rect x="10" y="135" width="8" height="50" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
    <rect x="182" y="135" width="8" height="50" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Monitor 1 -->
    <rect x="20" y="20" width="120" height="90" fill="#0a0f15" stroke="#00f0ff" stroke-width="2" filter="url(#screenGlow)"/>
    <rect x="25" y="25" width="110" height="75" fill="#0e1621"/>
    <!-- Screen content -->
    <text x="35" y="45" fill="#00f0ff" font-family="monospace" font-size="8">$ git push</text>
    <text x="35" y="58" fill="#ff00ff" font-family="monospace" font-size="8">deployed!</text>
    <text x="35" y="71" fill="#00f0ff" font-family="monospace" font-size="8">$ _</text>
    <rect x="35" y="73" width="6" height="10" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- Monitor stand -->
    <rect x="70" y="110" width="20" height="10" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Keyboard -->
    <rect x="40" y="125" width="80" height="8" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
    <!-- Mouse -->
    <ellipse cx="140" cy="128" rx="10" ry="6" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>

    <!-- Coffee mug -->
    <rect x="160" y="110" width="15" height="18" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <ellipse cx="167" cy="110" rx="7" ry="2" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    <!-- Steam -->
    <path d="M 165 105 Q 163 100 165 95" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Chair -->
    <rect x="60" y="160" width="60" height="8" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
    <rect x="85" y="168" width="10" height="20" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
  </g>

  <!-- Desk 2 -->
  <g transform="translate(280, 200)">
    <!-- Desk surface -->
    <rect x="0" y="100" width="180" height="12" fill="#15202e" stroke="#00f0ff" stroke-width="2"/>
    <!-- Desk legs -->
    <rect x="10" y="112" width="6" height="45" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
    <rect x="164" y="112" width="6" height="45" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Laptop -->
    <g transform="translate(30, 50)">
      <!-- Screen -->
      <rect x="0" y="0" width="100" height="60" fill="#0a0f15" stroke="#ff00ff" stroke-width="2" filter="url(#magentaGlow)"/>
      <rect x="5" y="5" width="90" height="48" fill="#0e1621"/>
      <!-- Code on screen -->
      <text x="10" y="20" fill="#00f0ff" font-family="monospace" font-size="7">1|func deploy()</text>
      <text x="10" y="32" fill="#ff00ff" font-family="monospace" font-size="7">2|  return ok</text>
      <text x="10" y="44" fill="#00f0ff" font-family="monospace" font-size="7">3|}</text>
      <!-- Keyboard base -->
      <rect x="0" y="60" width="100" height="6" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
    </g>

    <!-- Notebook -->
    <rect x="140" y="90" width="30" height="20" fill="#1a2a3a" stroke="#00f0ff" stroke-width="1" transform="rotate(-5, 155, 100)"/>
    <line x1="145" y1="95" x2="165" y2="94" stroke="#00f0ff" stroke-width="0.5" opacity="0.5"/>
    <line x1="145" y1="100" x2="165" y2="99" stroke="#00f0ff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- ===== RIGHT SIDE: BAR AREA ===== -->

  <!-- Bar counter -->
  <g transform="translate(550, 220)">
    <!-- Main counter -->
    <rect x="0" y="80" width="400" height="30" fill="url(#barGradient)" stroke="#ff00ff" stroke-width="3" filter="url(#magentaGlow)"/>
    <!-- Counter front -->
    <rect x="0" y="110" width="400" height="80" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <!-- Counter trim -->
    <line x1="0" y1="130" x2="400" y2="130" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="170" x2="400" y2="170" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>

    <!-- Back shelf -->
    <rect x="20" y="0" width="360" height="12" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <rect x="20" y="35" width="360" height="10" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>

    <!-- Bottles on shelf -->
    <!-- Bottle 1 - Tall -->
    <rect x="40" y="-50" width="20" height="50" fill="url(#bottleGradient)" stroke="#00f0ff" stroke-width="1"/>
    <rect x="45" y="-55" width="10" height="8" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
    <text x="50" y="-20" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="6">GIN</text>

    <!-- Bottle 2 -->
    <rect x="80" y="-40" width="18" height="40" fill="url(#bottleGradient)" stroke="#ff00ff" stroke-width="1"/>
    <rect x="84" y="-45" width="10" height="7" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
    <text x="89" y="-15" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="5">RUM</text>

    <!-- Bottle 3 - Wide -->
    <rect x="115" y="-35" width="25" height="35" fill="url(#bottleGradient)" stroke="#00f0ff" stroke-width="1"/>
    <rect x="122" y="-40" width="11" height="7" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Bottle 4 -->
    <rect x="160" y="-45" width="16" height="45" fill="url(#bottleGradient)" stroke="#ff00ff" stroke-width="1"/>
    <rect x="164" y="-50" width="8" height="7" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>

    <!-- Bottle 5 -->
    <rect x="195" y="-38" width="20" height="38" fill="url(#bottleGradient)" stroke="#00f0ff" stroke-width="1"/>
    <rect x="200" y="-43" width="10" height="7" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Bottle 6 -->
    <rect x="235" y="-42" width="18" height="42" fill="url(#bottleGradient)" stroke="#ff00ff" stroke-width="1"/>
    <rect x="239" y="-47" width="10" height="7" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>

    <!-- Bottle 7 -->
    <rect x="275" y="-35" width="22" height="35" fill="url(#bottleGradient)" stroke="#00f0ff" stroke-width="1"/>
    <rect x="281" y="-40" width="10" height="7" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

    <!-- Bottle 8 -->
    <rect x="320" y="-48" width="17" height="48" fill="url(#bottleGradient)" stroke="#ff00ff" stroke-width="1"/>
    <rect x="324" y="-53" width="9" height="7" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>

    <!-- === Mixology instruments on counter === -->

    <!-- Cocktail shaker -->
    <g transform="translate(60, 45)">
      <rect x="0" y="10" width="25" height="35" fill="#1a2a3a" stroke="#00f0ff" stroke-width="2"/>
      <rect x="3" y="0" width="19" height="12" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
      <ellipse cx="12" cy="10" rx="12" ry="3" fill="#1a2a3a" stroke="#00f0ff" stroke-width="1"/>
    </g>

    <!-- Jigger -->
    <g transform="translate(120, 55)">
      <polygon points="10,0 0,25 20,25" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
      <polygon points="10,25 5,35 15,35" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
    </g>

    <!-- Mixing glass -->
    <g transform="translate(170, 40)">
      <rect x="0" y="15" width="30" height="40" fill="#0a1520" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
      <ellipse cx="15" cy="15" rx="15" ry="4" fill="none" stroke="#00f0ff" stroke-width="1"/>
      <!-- Liquid -->
      <rect x="3" y="35" width="24" height="18" fill="#ff00ff" opacity="0.3"/>
      <!-- Bar spoon -->
      <line x1="15" y1="5" x2="15" y2="50" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="15" cy="5" r="4" fill="none" stroke="#00f0ff" stroke-width="1"/>
    </g>

    <!-- Strainer -->
    <g transform="translate(230, 60)">
      <ellipse cx="15" cy="8" rx="15" ry="8" fill="none" stroke="#ff00ff" stroke-width="2"/>
      <rect x="0" y="8" width="30" height="15" fill="none" stroke="#ff00ff" stroke-width="1"/>
      <line x1="5" y1="12" x2="25" y2="12" stroke="#ff00ff" stroke-width="0.5"/>
      <line x1="5" y1="16" x2="25" y2="16" stroke="#ff00ff" stroke-width="0.5"/>
      <line x1="5" y1="20" x2="25" y2="20" stroke="#ff00ff" stroke-width="0.5"/>
    </g>

    <!-- Cocktail glasses -->
    <g transform="translate(290, 50)">
      <!-- Martini glass -->
      <polygon points="20,0 0,25 40,25" fill="none" stroke="#00f0ff" stroke-width="1"/>
      <line x1="20" y1="25" x2="20" y2="40" stroke="#00f0ff" stroke-width="1"/>
      <ellipse cx="20" cy="40" rx="12" ry="3" fill="none" stroke="#00f0ff" stroke-width="1"/>
      <!-- Olive -->
      <circle cx="20" cy="15" r="3" fill="#ff00ff" opacity="0.5"/>
    </g>

    <!-- Muddler -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="10" height="40" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>
      <rect x="-2" y="35" width="14" height="8" fill="#1a2a3a" stroke="#ff00ff" stroke-width="1"/>
    </g>

    <!-- Ice bucket -->
    <g transform="translate(380, 45)">
      <rect x="0" y="10" width="35" height="30" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
      <!-- Ice cubes visible -->
      <rect x="5" y="15" width="8" height="8" fill="#1a3a4a" stroke="#00f0ff" stroke-width="0.5" opacity="0.7"/>
      <rect x="15" y="18" width="8" height="8" fill="#1a3a4a" stroke="#00f0ff" stroke-width="0.5" opacity="0.7"/>
      <rect x="10" y="26" width="8" height="8" fill="#1a3a4a" stroke="#00f0ff" stroke-width="0.5" opacity="0.7"/>
      <!-- Handle -->
      <path d="M 5 10 Q 17 0 30 10" stroke="#00f0ff" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Bar stools -->
  <g transform="translate(600, 380)">
    <circle cx="30" cy="0" r="20" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <rect x="27" y="20" width="6" height="40" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
    <ellipse cx="30" cy="60" rx="15" ry="5" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
  </g>

  <g transform="translate(720, 385)">
    <circle cx="30" cy="0" r="18" fill="#0e1621" stroke="#00f0ff" stroke-width="2"/>
    <rect x="27" y="18" width="6" height="35" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
    <ellipse cx="30" cy="53" rx="14" ry="4" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>
  </g>

  <g transform="translate(840, 382)">
    <circle cx="30" cy="0" r="19" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <rect x="27" y="19" width="6" height="38" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
    <ellipse cx="30" cy="57" rx="14" ry="5" fill="#0e1621" stroke="#ff00ff" stroke-width="1"/>
  </g>

  <!-- Neon sign on wall -->
  <g transform="translate(700, 80)">
    <text x="0" y="0" fill="#00f0ff" font-family="monospace" font-size="28" font-weight="bold" filter="url(#cyanGlow)">
      <tspan>WEBDEPLOY</tspan>
    </text>
    <text x="80" y="30" fill="#ff00ff" font-family="monospace" font-size="14" filter="url(#magentaGlow)">
      <tspan>HQ_</tspan>
    </text>
    <!-- Blinking effect -->
    <rect x="-5" y="-25" width="220" height="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Ceiling lights -->
  <g>
    <line x1="150" y1="0" x2="150" y2="30" stroke="#00f0ff" stroke-width="2"/>
    <rect x="130" y="30" width="40" height="10" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <line x1="135" y1="40" x2="165" y2="80" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
    <line x1="165" y1="40" x2="135" y2="80" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>

    <line x1="400" y1="0" x2="400" y2="25" stroke="#ff00ff" stroke-width="2"/>
    <rect x="380" y="25" width="40" height="10" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>

    <line x1="750" y1="0" x2="750" y2="35" stroke="#00f0ff" stroke-width="2"/>
    <rect x="730" y="35" width="40" height="10" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
  </g>

  <!-- Decorative corner elements -->
  <path d="M 15 15 L 15 50 M 15 15 L 50 15" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 985 15 L 985 50 M 985 15 L 950 15" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 15 485 L 15 450 M 15 485 L 50 485" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 985 485 L 985 450 M 985 485 L 950 485" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- Status bar at bottom -->
  <g transform="translate(0, 480)">
    <rect x="0" y="0" width="1000" height="20" fill="#0a0f15" opacity="0.8"/>
    <text x="20" y="14" fill="#00f0ff" font-family="monospace" font-size="10" opacity="0.7">&gt; LOCATION: PARMA, ITALY</text>
    <text x="500" y="14" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="10" opacity="0.7">[ WORK HARD, MIX HARDER ]</text>
    <text x="980" y="14" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="10" opacity="0.7">STATUS: OPERATIONAL</text>
  </g>
</svg>
