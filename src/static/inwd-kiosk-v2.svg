<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="kio-title kio-desc">
  <title id="kio-title">inWD interactive kiosk</title>
  <desc id="kio-desc">A neon Linux kiosk totem with live status terminal, touch ripple, NFC card reader, Tux mascot and connections to the inWD cloud and GitOps, in cyan and magenta on a dark grid.</desc>
  <defs>
    <!-- Grid pattern -->
    <pattern id="kio-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    </pattern>
    <!-- CRT scanlines -->
    <pattern id="kio-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.25)"/>
    </pattern>
    <!-- Dual-layer glows -->
    <filter id="kio-cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="kio-magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff00ff" flood-opacity="0.4"/>
    </filter>
    <filter id="kio-screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="kio-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <style>
      .kio-march { animation: kio-march 1s linear infinite; }
      .kio-blink { animation: kio-blink 1s steps(1) infinite; }
      .kio-pulse { animation: kio-pulse 2s ease-in-out infinite; }
      .kio-pulse-fast { animation: kio-pulse 0.8s ease-in-out infinite; }
      .kio-type { animation: kio-type 0.01s steps(1) backwards; }
      .kio-l1 { animation-delay: 0.3s; }  .kio-l2 { animation-delay: 0.6s; }
      .kio-l3 { animation-delay: 1.0s; }  .kio-l4 { animation-delay: 1.3s; }
      .kio-l5 { animation-delay: 1.7s; }  .kio-l6 { animation-delay: 2.0s; }
      .kio-l7 { animation-delay: 2.4s; }  .kio-l8 { animation-delay: 2.7s; }
      .kio-l9 { animation-delay: 3.1s; }  .kio-l10 { animation-delay: 3.4s; }
      .kio-ping { transform-box: fill-box; transform-origin: center; animation: kio-ping 2.4s ease-out infinite; }
      .kio-bob { animation: kio-bob 4s ease-in-out infinite; }
      .kio-card { animation: kio-card 3.2s ease-in-out infinite; }
      .kio-pkt { transform-box: fill-box; offset-rotate: 0deg; }
      .kio-pkt-a { offset-path: path('M 425 230 C 470 230 480 195 488 165'); animation: kio-run 2s linear infinite; }
      .kio-pkt-b { offset-path: path('M 425 250 C 470 250 480 285 488 300'); animation: kio-run 2s linear 1s infinite; }
      .kio-d2 { animation-delay: 1.2s; }
      .kio-d3 { animation-delay: 0.5s; }
      @keyframes kio-march { to { stroke-dashoffset: -20; } }
      @keyframes kio-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes kio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes kio-type { from { opacity: 0; } to { opacity: 1; } }
      @keyframes kio-ping { 0% { transform: scale(0.5); opacity: 0.9; } 80%, 100% { transform: scale(1.8); opacity: 0; } }
      @keyframes kio-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes kio-card {
        0% { transform: translateX(-100px); opacity: 0; }
        15% { transform: translateX(-75px); opacity: 1; }
        65% { transform: translateX(0); opacity: 1; }
        80% { transform: translateX(0); opacity: 0; }
        100% { transform: translateX(0); opacity: 0; }
      }
      @keyframes kio-run {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="#050a10"/>
  <rect width="600" height="500" fill="url(#kio-grid)"/>

  <!-- Decorative lines + floor -->
  <line x1="0" y1="20" x2="600" y2="20" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="482" x2="550" y2="482" stroke="#00f0ff" stroke-width="2" opacity="0.25"/>
  <ellipse cx="300" cy="484" rx="150" ry="8" fill="#000" opacity="0.55"/>

  <!-- Kiosk stand -->
  <polygon points="255,440 345,440 355,478 245,478" fill="#0e1621" stroke="#00f0ff" stroke-width="1.5"/>
  <rect x="233" y="476" width="134" height="6" fill="#0e1621" stroke="#00f0ff" stroke-width="1"/>

  <!-- Kiosk Body -->
  <g transform="translate(175, 40)">
    <!-- Retro hard offset shadow -->
    <rect x="6" y="6" width="250" height="400" fill="rgba(255,0,255,0.22)"/>
    <rect x="0" y="0" width="250" height="400" fill="#0e1621" stroke="#00f0ff" stroke-width="3" filter="url(#kio-cyanGlow)"/>
    <rect x="10" y="10" width="230" height="380" fill="#0a0f15" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>

    <!-- Screen -->
    <rect x="20" y="20" width="210" height="280" fill="#0a1520" stroke="#00f0ff" stroke-width="2" filter="url(#kio-screenGlow)"/>

    <!-- Screen content - Linux status terminal, typed in -->
    <g transform="translate(30, 30)" font-family="monospace">
      <rect x="0" y="0" width="190" height="20" fill="#15202e"/>
      <circle cx="12" cy="10" r="4" fill="#ff00ff"/>
      <circle cx="28" cy="10" r="4" fill="#00f0ff"/>
      <circle cx="44" cy="10" r="4" fill="#00f0ff" opacity="0.5"/>
      <text x="100" y="14" text-anchor="middle" fill="#00f0ff" font-size="8">inWD_KIOSK</text>

      <text class="kio-type kio-l1" x="5" y="40" fill="#00f0ff" font-size="9">&gt; system.status</text>
      <text class="kio-type kio-l2" x="5" y="54" fill="#ff00ff" font-size="9">● ONLINE</text>
      <text class="kio-type kio-l3" x="5" y="72" fill="#00f0ff" font-size="9">&gt; display.mode</text>
      <text class="kio-type kio-l4" x="5" y="86" fill="#ff00ff" font-size="9">INTERACTIVE</text>
      <text class="kio-type kio-l5" x="5" y="104" fill="#00f0ff" font-size="9">&gt; os.kernel</text>
      <text class="kio-type kio-l6" x="5" y="118" fill="#ff00ff" font-size="9">Linux 6.x LTS</text>
      <text class="kio-type kio-l7" x="5" y="136" fill="#00f0ff" font-size="9">&gt; touch.enabled</text>
      <text class="kio-type kio-l8" x="5" y="150" fill="#ff00ff" font-size="9">TRUE</text>
      <text class="kio-type kio-l9" x="5" y="168" fill="#00f0ff" font-size="9">&gt; license</text>
      <text class="kio-type kio-l10" x="5" y="182" fill="#ff00ff" font-size="9">OPEN_SOURCE</text>

      <rect class="kio-blink" x="5" y="195" width="8" height="12" fill="#00f0ff"/>
    </g>

    <!-- Scanlines + glare -->
    <rect x="20" y="20" width="210" height="280" fill="url(#kio-scan)" opacity="0.5"/>
    <polygon points="20,20 90,20 35,300 20,300" fill="#fff" opacity="0.04"/>

    <!-- Touch ripple -->
    <g transform="translate(125, 250)">
      <circle class="kio-ping" r="15" fill="none" stroke="#ff00ff" stroke-width="1.5"/>
      <circle class="kio-ping kio-d2" r="15" fill="none" stroke="#ff00ff" stroke-width="1"/>
      <circle r="5" fill="#ff00ff" opacity="0.85"/>
    </g>

    <!-- Control panel -->
    <rect x="20" y="310" width="210" height="70" fill="#15202e" stroke="#ff00ff" stroke-width="1"/>

    <!-- Status LEDs -->
    <g transform="translate(40, 325)" font-family="monospace" font-size="8">
      <circle class="kio-pulse" cx="0" cy="0" r="5" fill="#00f0ff"/>
      <text x="12" y="4" fill="#00f0ff">PWR</text>
      <circle class="kio-pulse-fast" cx="50" cy="0" r="5" fill="#00f0ff"/>
      <text x="62" y="4" fill="#00f0ff">NET</text>
      <circle cx="100" cy="0" r="5" fill="#ff00ff"/>
      <text x="112" y="4" fill="#ff00ff">APP</text>
    </g>

    <!-- NFC/Card reader slot + card swiping across it -->
    <rect x="60" y="345" width="130" height="25" fill="#0a0f15" stroke="#00f0ff" stroke-width="1"/>
    <g transform="translate(170, 349)">
      <g class="kio-card">
        <rect x="-13" y="0" width="26" height="16" rx="2" fill="#0a0f15" stroke="#00f0ff" stroke-width="1.5"/>
        <rect x="-9" y="4" width="8" height="6" fill="#ff00ff" opacity="0.8"/>
      </g>
    </g>
    <text x="118" y="362" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="8" opacity="0.7">NFC / CARD</text>
  </g>

  <!-- Tux mascot -->
  <g transform="translate(58, 140)">
    <g class="kio-bob">
      <ellipse cx="12" cy="62" rx="7" ry="20" fill="#0a0f15" stroke="#00f0ff" stroke-width="1.5" transform="rotate(22 12 62)"/>
      <ellipse cx="68" cy="62" rx="7" ry="20" fill="#0a0f15" stroke="#00f0ff" stroke-width="1.5" transform="rotate(-22 68 62)"/>
      <ellipse cx="26" cy="102" rx="11" ry="5" fill="#ff00ff"/>
      <ellipse cx="54" cy="102" rx="11" ry="5" fill="#ff00ff"/>
      <ellipse cx="40" cy="66" rx="27" ry="36" fill="#0a0f15" stroke="#00f0ff" stroke-width="2"/>
      <ellipse cx="40" cy="74" rx="16" ry="23" fill="#15202e" stroke="#00f0ff" stroke-width="1" opacity="0.9"/>
      <circle cx="40" cy="22" r="19" fill="#0a0f15" stroke="#00f0ff" stroke-width="2" filter="url(#kio-cyanGlow)"/>
      <ellipse cx="33" cy="17" rx="5" ry="6.5" fill="#fff"/>
      <ellipse cx="47" cy="17" rx="5" ry="6.5" fill="#fff"/>
      <circle cx="34.5" cy="18" r="2.4" fill="#000"/>
      <circle cx="45.5" cy="18" r="2.4" fill="#000"/>
      <circle cx="33.3" cy="16" r="0.9" fill="#fff"/>
      <circle cx="44.3" cy="16" r="0.9" fill="#fff"/>
      <polygon points="32,28 48,28 40,36" fill="#ff00ff"/>
      <ellipse cx="40" cy="36.5" rx="4" ry="2" fill="#b300b3"/>
    </g>
    <text x="40" y="124" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="10">LINUX</text>
  </g>

  <!-- Connection lines to cloud/server -->
  <g stroke-width="2" fill="none">
    <path class="kio-march" d="M 425 230 C 470 230 480 195 488 165" stroke="#00f0ff" stroke-dasharray="5 5"/>
    <path class="kio-march" d="M 425 250 C 470 250 480 285 488 300" stroke="#ff00ff" stroke-dasharray="5 5"/>
  </g>
  <circle class="kio-pkt kio-pkt-a" cx="425" cy="230" r="3.5" fill="#00f0ff"/>
  <circle class="kio-pkt kio-pkt-b" cx="425" cy="250" r="3.5" fill="#ff00ff"/>

  <!-- inWD cloud/server -->
  <g transform="translate(490, 130)">
    <rect x="0" y="0" width="60" height="50" fill="#0e1621" stroke="#00f0ff" stroke-width="2" filter="url(#kio-cyanGlow)"/>
    <rect x="8" y="10" width="44" height="8" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="kio-pulse" cx="46" cy="14" r="2" fill="#00f0ff"/>
    <rect x="8" y="22" width="44" height="8" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="kio-pulse kio-d3" cx="46" cy="26" r="2" fill="#ff00ff"/>
    <rect x="8" y="34" width="44" height="8" fill="#15202e" stroke="#00f0ff" stroke-width="1"/>
    <circle class="kio-pulse kio-d2" cx="46" cy="38" r="2" fill="#00f0ff"/>
    <text x="30" y="65" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="8">INWD</text>
  </g>

  <!-- GitOps graph -->
  <g transform="translate(490, 270)">
    <circle class="kio-pulse" cx="30" cy="15" r="12" fill="#0e1621" stroke="#ff00ff" stroke-width="2" filter="url(#kio-magentaGlow)"/>
    <circle class="kio-pulse kio-d3" cx="30" cy="55" r="12" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <line x1="30" y1="27" x2="30" y2="43" stroke="#ff00ff" stroke-width="2"/>
    <circle cx="52" cy="35" r="8" fill="#0e1621" stroke="#ff00ff" stroke-width="2"/>
    <path d="M 38 20 Q 52 22 52 27" stroke="#ff00ff" stroke-width="2" fill="none"/>
    <path d="M 52 43 Q 52 50 38 52" stroke="#ff00ff" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
    <text x="30" y="80" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="8">GITOPS</text>
  </g>

  <!-- Feature labels -->
  <g font-family="monospace" font-size="10" opacity="0.8">
    <text x="100" y="496" text-anchor="middle" fill="#00f0ff">OPEN SOURCE</text>
    <text x="300" y="496" text-anchor="middle" fill="#ff00ff">INTERACTIVE</text>
    <text x="500" y="496" text-anchor="middle" fill="#00f0ff">MANAGED</text>
  </g>

  <!-- Corner accents -->
  <path d="M 10 10 L 10 40 M 10 10 L 40 10" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 590 10 L 590 40 M 590 10 L 560 10" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 10 490 L 10 460 M 10 490 L 40 490" stroke="#ff00ff" stroke-width="2" fill="none"/>
  <path d="M 590 490 L 590 460 M 590 490 L 560 490" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- CRT vignette -->
  <rect width="600" height="500" fill="url(#kio-vignette)" pointer-events="none"/>
</svg>
