<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="p2s-title p2s-desc">
  <title id="p2s-title">PHP2Shell — CVE-2026-109618 and CVE-2026-109619</title>
  <desc id="p2s-desc">A terminal window on a dark grid shows a PHP version check and a critical security warning, in cyan and magenta.</desc>
  <defs>
    <pattern id="p2s-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="p2s-cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f0ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="p2s-magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff00ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff00ff" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="p2s-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15202e"/>
      <stop offset="100%" stop-color="#0a0f15"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#05080c"/>
  <rect width="600" height="400" fill="url(#p2s-grid)"/>

  <!-- Terminal window -->
  <g filter="url(#p2s-cyanGlow)">
    <rect x="70" y="60" width="460" height="280" fill="url(#p2s-panel)" stroke="#00f0ff" stroke-width="2"/>
  </g>
  <rect x="70" y="60" width="460" height="28" fill="#0d1520" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="90" cy="74" r="5" fill="#ff00ff"/>
  <circle cx="108" cy="74" r="5" fill="#334155"/>
  <circle cx="126" cy="74" r="5" fill="#334155"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text x="92" y="122" fill="#00f0ff">$ php -v</text>
    <text x="92" y="148" fill="#94a3b8">PHP 8.x.y (fpm-fcgi)</text>
    <text x="92" y="186" fill="#ff00ff" filter="url(#p2s-magentaGlow)">[CRITICAL] CVE-2026-109618</text>
    <text x="92" y="212" fill="#ff00ff" filter="url(#p2s-magentaGlow)">[CRITICAL] CVE-2026-109619</text>
    <text x="92" y="250" fill="#00f0ff">$ upgrade --to 8.2.35 | 8.3.36</text>
    <text x="92" y="276" fill="#00f0ff">               | 8.4.27 | 8.5.12</text>
    <text x="92" y="314" fill="#e2e8f0">_</text>
  </g>

  <!-- Badge -->
  <g filter="url(#p2s-magentaGlow)">
    <rect x="388" y="30" width="170" height="40" fill="#05080c" stroke="#ff00ff" stroke-width="2"/>
  </g>
  <text x="473" y="57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#ff00ff" letter-spacing="2">PHP2SHELL</text>
</svg>
