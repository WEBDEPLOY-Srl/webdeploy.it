<form
	id="newsletter-signup"
	data-required="{{newsletter.requiredError}}"
	data-setup-error="{{newsletter.setupError}}"
	data-verification-error="{{newsletter.verificationError}}"
	data-request-error="{{newsletter.requestError}}"
	data-unknown-result="{{newsletter.unknownResult}}"
	data-rate-limit-error="{{newsletter.rateLimitError}}"
	data-success="{{newsletter.success}}"
	data-submitting="{{newsletter.submitting}}"
	action="https://newsletter.webdeploy.it/subscription/form"
	method="post"
	accept-charset="UTF-8"
	autocomplete="off"
	class="newsletter-form"
>
	<fieldset aria-describedby="newsletter-list-error" class="newsletter-lists">
		<legend>{{newsletter.whatTitle}}</legend>
		<div class="newsletter-choices">
			<label class="newsletter-choice">
				<input
					type="checkbox"
					name="l"
					value="300c28fe-d91b-4965-b247-da6e6dafdb7a"
					autocomplete="off"
				/>
				<span class="newsletter-choice__body">{{newsletter.generalText}}</span>
			</label>
			<label class="newsletter-choice">
				<input
					type="checkbox"
					name="l"
					value="71ca6320-90f7-4cd5-9e52-cb53ba5b84ba"
					autocomplete="off"
				/>
				<span class="newsletter-choice__body">{{newsletter.marketingText}}</span>
			</label>
		</div>
		<p id="newsletter-list-error" class="form-error" role="alert"></p>
	</fieldset>
	<div class="newsletter-delivery">
		<div class="email-field">
			<label for="newsletter-email">{{newsletter.emailLabel}}</label>
			<input
				id="newsletter-email"
				type="email"
				name="email"
				autocomplete="email"
				inputmode="email"
				placeholder="{{newsletter.emailPlaceholder}}"
				required=""
			/>
		</div>
		<button class="newsletter-submit" type="submit" disabled>{{newsletter.submit}}</button>
	</div>
	<input type="hidden" name="nonce" value="" />
	<template data-spam-widget>
		<altcha-widget
			challenge="https://newsletter.webdeploy.it/api/public/captcha/altcha"
			auto="off"
			configuration='{"humanInteractionSignature":false}'
			display="invisible"
			name="altcha"
		></altcha-widget>
	</template>
	<p class="form-error" data-submit-error role="alert" tabindex="-1" hidden></p>
	<p class="newsletter-status" role="status" tabindex="-1"></p>
	<div class="newsletter-followup">
		<details>
			<summary>{{newsletter.afterSignup}}</summary>
			<ul>
				<li>{{newsletter.confirmationNote}}</li>
				<li>{{newsletter.newsNote}} <a href="/news">{{newsletter.recentNews}}</a></li>
				<li>{{newsletter.servicesNote}}</li>
				<li>{{newsletter.withdrawalNote}}</li>
				<li>{{newsletter.controllerNote}}</li>
			</ul>
		</details>
		<a href="/privacy#newsletter">{{newsletter.privacyLink}}</a>
	</div>
	<noscript><p class="form-error">{{newsletter.noScript}}</p></noscript>
</form>
