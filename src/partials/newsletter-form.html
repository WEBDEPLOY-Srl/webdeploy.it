<form
	action="https://newsletter.webdeploy.it/subscription/form"
	method="post"
	accept-charset="UTF-8"
	autocomplete="off"
	class="newsletter-form"
>
	<fieldset aria-describedby="newsletter-list-error" class="newsletter-lists">
		<legend>{{newsletter.whatTitle}}</legend>
		<label class="newsletter-choice"
			><input
				type="checkbox"
				name="l"
				value="300c28fe-d91b-4965-b247-da6e6dafdb7a"
				autocomplete="off"
			/>
			<span><strong>{{newsletter.generalLabel}}.</strong> {{newsletter.generalText}}</span></label
		>
		<label class="newsletter-choice"
			><input
				type="checkbox"
				name="l"
				value="71ca6320-90f7-4cd5-9e52-cb53ba5b84ba"
				autocomplete="off"
			/>
			<span
				><strong>{{newsletter.marketingLabel}}.</strong> {{newsletter.marketingText}}</span
			></label
		>
		<p id="newsletter-list-error" class="form-error" role="alert"></p>
	</fieldset>
	<div class="email-field">
		<label for="newsletter-email">{{newsletter.emailLabel}}</label>
		<input
			id="newsletter-email"
			type="email"
			name="email"
			autocomplete="email"
			inputmode="email"
			placeholder="{{newsletter.emailPlaceholder}}"
			required=""
		/>
	</div>
	<input type="hidden" name="nonce" value="" />
	<altcha-widget
		challenge="https://newsletter.webdeploy.it/api/public/captcha/altcha"
		auto="off"
		configuration='{"humanInteractionSignature":false}'
		display="invisible"
		name="altcha"
	></altcha-widget>
	<button class="newsletter-submit" type="submit" disabled="">{{newsletter.submit}}</button>
	<p class="newsletter-note">
		{{newsletter.confirmationNote}} <a href="/privacy#newsletter">{{newsletter.privacyLink}}</a>
	</p>
	<noscript><p class="form-error">{{newsletter.noScript}}</p></noscript>
</form>
