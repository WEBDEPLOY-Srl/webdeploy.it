<aside aria-labelledby="consent-title" tabindex="-1">
	<div class="consent-panel">
		<h2 id="consent-title" class="sr-only">{{consent.title}}</h2>
		<p class="consent-copy">
			Matomo is cookieless. Meta ads use cookies only if you accept. Read our
			<a href="/privacy" class="prose-link">privacy notice</a>.
		</p>
		<div class="consent-actions">
			<button type="button" class="consent-button">{{consent.reject}}</button>
			<button type="button" class="consent-button">{{consent.accept}}</button>
		</div>
	</div>
</aside>
