<aside class="cookie-banner" aria-label="{{consent.title}}" tabindex="-1">
	<h2 class="consent-heading">{{consent.title}}</h2>
	<div class="consent-panel">
		<p class="consent-copy">{{@consentBody}}</p>
		<div class="consent-actions">
			<button type="button" class="consent-button" data-choice="close" hidden>
				{{consent.close}}
			</button>
			<button type="button" class="consent-button" data-choice="denied">{{consent.reject}}</button>
			<button type="button" class="consent-button" data-choice="granted">{{consent.accept}}</button>
		</div>
	</div>
</aside>
