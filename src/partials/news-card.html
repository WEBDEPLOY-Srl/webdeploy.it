<article class="card-retro news-card">
	<a href="{{@url}}" class="news-card__link"
		><div class="news-card__figure">
			<img
				src="{{@image}}"
				alt=""
				width="{{@width}}"
				height="{{@height}}"
				loading="lazy"
				decoding="async"
				class="news-card__image"
			/>
			<div class="news-card__date">{{@date}}</div>
		</div>
		<div class="news-card__body">
			<h2 class="news-card__title">{{@title}}</h2>
			<p class="news-card__description">{{@description}}</p>
			<span class="news-card__more">&gt; {{news.readMore}}</span>
		</div></a
	>
</article>
