<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#050a10" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/favicon.png" />
		<link
			rel="preload"
			href="/fonts/space-mono-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/vt323-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		{{@head}}
		<noscript><link rel="stylesheet" href="{{@assetBase}}/css/no-script.css" /></noscript>
	</head>
	<body
		data-matomo-url="{{@matomoUrl}}"
		data-matomo-site="{{@matomoSite}}"
		data-pixel-id="{{@pixelId}}"
	>
		<div class="site-shell {{@shellClass}}">
			<a href="#main-content" class="skip-link">{{common.skipToContent}}</a>
			<div class="crt-scanlines" aria-hidden="true"></div>
			{{>header}}
			<main id="main-content" class="site-main" tabindex="-1">{{@body}}</main>
			{{>footer}}
			<template id="consent-template">{{>consent}}</template>
		</div>
	</body>
</html>
