<div class="newsletter-page">
	<div class="newsletter-intro">
		<h1>{{newsletter.heading}}</h1>
		<picture class="newsletter-stamp">
			<source type="image/avif" srcset="{{@prioritySources}}" sizes="{{@prioritySizes}}" />
			<source
				type="image/webp"
				srcset="/images/neon-cafe-stamp-400.webp 400w, /images/neon-cafe-stamp-592.webp 592w, /images/neon-cafe-stamp-672.webp 672w, /images/neon-cafe-stamp-800.webp 800w, /images/neon-cafe-stamp-960.webp 960w"
				sizes="{{@prioritySizes}}"
			/>
			<img
				src="/images/neon-cafe-stamp-960.webp"
				width="960"
				height="540"
				alt=""
				loading="eager"
				decoding="async"
				fetchpriority="high"
			/>
		</picture>
	</div>
	{{>newsletter-form}}
</div>
<section class="contact-band newsletter-endband">
	<div class="contact-band__top"></div>
	<div class="contact-band__bottom"></div>
	<div class="contact-band__inner">
		<h2 class="contact-band__title">{{newsletter.endbandTitle}}</h2>
		<p class="contact-band__lead">{{newsletter.endbandText}}</p>
		<a href="#newsletter-signup" class="btn-cta-primary contact-band__action"
			>{{newsletter.endbandLink}}</a
		>
	</div>
</section>
