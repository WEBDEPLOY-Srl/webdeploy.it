<div class="newsletter-page">
	<div class="newsletter-intro">
		<h1>{{newsletter.heading}}</h1>
		<div class="newsletter-intro__copy">
			<p class="newsletter-lead">{{newsletter.lead}}</p>
			<a href="/news">{{newsletter.recentNews}}</a>
		</div>
		<picture class="newsletter-stamp">
			<source type="image/avif" srcset="/images/neon-cafe-960.avif" />
			<img src="/images/neon-cafe-workshop.webp" width="960" height="540" alt="" />
		</picture>
	</div>
	{{>newsletter-form}}
</div>
